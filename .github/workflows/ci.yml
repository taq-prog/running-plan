name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore RunningPlan.slnx

      - name: Build
        run: dotnet build RunningPlan.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RunningPlan.slnx --configuration Release --no-build

      - name: Validate plan
        run: dotnet run --project src/RunningPlan.Cli --configuration Release --no-build -- validate plans/plan-12-weeks.yaml

      - name: Dry-run sync
        run: dotnet run --project src/RunningPlan.Cli --configuration Release --no-build -- sync plans/plan-12-weeks.yaml --athlete-id ci-athlete --api-key ci-key --dry-run --no-verify --json
