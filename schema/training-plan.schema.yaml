$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.local/running-plan.schema.yaml"
title: "Running Plan Schema"
type: object
required:
  - meta
  - weeks
properties:
  meta:
    type: object
    required: [name, start_date, timezone]
    properties:
      name:
        type: string
        minLength: 3
      start_date:
        type: string
        format: date
      timezone:
        type: string
        minLength: 3
      start_time_local:
        type: string
        pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      default_targets:
        type: object
        properties:
          easy_hr: { $ref: "#/$defs/hrRange" }
          steady_hr: { $ref: "#/$defs/hrRange" }
          tempo_hr: { $ref: "#/$defs/hrRange" }
      hr_profile:
        type: object
        required: [threshold, max, hrrc_min, zones]
        properties:
          threshold: { type: integer, minimum: 50, maximum: 230 }
          max: { type: integer, minimum: 50, maximum: 230 }
          hrrc_min: { type: integer, minimum: 50, maximum: 230 }
          zones:
            type: object
            required: [z1, z2, z3, z4, z5, z6, z7]
            properties:
              z1: { $ref: "#/$defs/hrRange" }
              z2: { $ref: "#/$defs/hrRange" }
              z3: { $ref: "#/$defs/hrRange" }
              z4: { $ref: "#/$defs/hrRange" }
              z5: { $ref: "#/$defs/hrRange" }
              z6: { $ref: "#/$defs/hrRange" }
              z7: { $ref: "#/$defs/hrRange" }
  weeks:
    type: array
    minItems: 1
    items:
      type: object
      required: [number, workouts]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 53
        workouts:
          type: array
          minItems: 1
          items:
            $ref: "#/$defs/workout"
$defs:
  hrRange:
    type: object
    required: [min, max]
    properties:
      min:
        type: integer
        minimum: 0
        maximum: 230
      max:
        type: integer
        minimum: 50
        maximum: 230
  workout:
    type: object
    required: [id, name, day, type, category]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9_-]+$"
      name:
        type: string
        minLength: 3
      day:
        type: string
        enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
      type:
        type: string
      category:
        type: string
      distance_km:
        type: integer
        minimum: 1
      duration_min:
        type: integer
        minimum: 1
      duration_sec:
        type: integer
        minimum: 1
      target_hr:
        $ref: "#/$defs/hrRange"
      tags:
        type: array
        items:
          type: string
      steps:
        type: array
        items:
          $ref: "#/$defs/step"
  step:
    type: object
    required: [kind]
    properties:
      kind:
        type: string
      distance_km:
        type: integer
        minimum: 1
      duration_min:
        type: integer
        minimum: 1
      duration_sec:
        type: integer
        minimum: 1
      repeats:
        type: integer
        minimum: 1
      target_hr:
        $ref: "#/$defs/hrRange"
      note:
        type: string
      steps:
        type: array
        items:
          $ref: "#/$defs/step"
